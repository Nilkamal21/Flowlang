[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlang-lang"
version = "0.1.0"
description = "A pipeline-oriented programming language with Compiler and Virtual Machine."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["programming-language", "compiler", "virtual-machine", "bytecode", "pipeline"]
authors = [
    { name = "Nilkamal Adhikari" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
flowlang = "flowlang.cli:main"

[tool.setuptools.packages.find]
where = ["."]
